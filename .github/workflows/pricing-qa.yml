name: Existing site QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node tests / Astro check / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node regression tests
        run: node --test tests/*.test.mjs
      - name: Run Astro type checks
        run: npm run check
      - name: Build Astro/Cloudflare output without deployment
        run: npm run build
      - name: Verify approved pricing in local production mode
        run: node scripts/qa-pricing-production.mjs
      - name: Install headless browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Check pricing and booking links on responsive viewports
        run: node scripts/qa-pricing-browser.mjs
      - name: Check complete public pages and three-step booking without API writes
        run: |
          ASTRO_DEV_BACKGROUND=1 npm run dev -- --host 127.0.0.1 --port 4321 > /tmp/site-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-site-browser.mjs
      - name: Preserve visual pricing review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-visual-review
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
